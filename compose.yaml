# Local development database only. It listens on the loopback interface, and the password comes
# from the environment (see .env.example) so no credential is kept in the repository.
services:
  db:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_USER: bestregards
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bestregards
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestregards"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
