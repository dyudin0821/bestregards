name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # the version the Dockerfile builds with
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci

      - run: npm --prefix web test

      - run: npm --prefix web run build

      # The audit covers what ships to browsers; build tooling is not part of the bundle.
      - run: npm --prefix web audit --omit=dev

      # The Go tests serve the built frontend, and the binary embeds it.
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    needs: web
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27", "stable"]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bestregards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/bestregards?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go build ./...

      # -p 1: the packages share one database and clean up after themselves, so they run one at a time.
      - name: Run tests
        run: go test -race -shuffle=on -count=1 -p 1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.go == 'stable'
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
