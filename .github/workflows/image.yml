name: Image

# The release artifact is one OCI image in GHCR. Every pushed image carries:
#  - the OCI labels of the repository (org.opencontainers.image.*),
#  - BuildKit's in-registry provenance and SBOM attestations (part of the image index),
#  - a signed SLSA provenance attestation from GitHub, stored next to the image as an OCI referrer.
# Deploy by digest and verify it: gh attestation verify oci://ghcr.io/<owner>/bestregards@sha256:... --owner <owner>

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a publish half way

jobs:
  scan:
    name: Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bestregards:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bestregards:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true # a finding nobody can fix yet should not block a deploy
          exit-code: "1"

      - name: Upload Trivy results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) # forks cannot upload to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  publish:
    name: Build, Attest & Push
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN pushes to GHCR; no other registry and no secrets are used
      attestations: write # the signed provenance
      id-token: write # the OIDC token Sigstore signs with

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT" # registries want lowercase

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.title=bestregards
            org.opencontainers.image.description=Переводчик с корпоративного языка и обратно

      # Pull requests build the image to prove the Dockerfile works, and never push it.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64 # add linux/arm64 (and docker/setup-qemu-action) if the cluster needs it
          provenance: mode=max
          sbom: true
          outputs: type=image,oci-mediatypes=true,push=${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Proves the attestation really is retrievable and bound to this repository before anyone deploys it.
      - name: Verify the attestation
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: gh attestation verify "oci://${IMAGE}" --repo "${GITHUB_REPOSITORY}"

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Image'
            echo
            echo 'Deploy by digest:'
            echo '```'
            echo "${IMAGE}"
            echo '```'
            echo
            echo 'Tags:'
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
