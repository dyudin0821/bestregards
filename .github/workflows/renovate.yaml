name: Renovate

on:
  schedule:
    # 00:17 UTC on Monday is 03:17 in Europe/Moscow, inside the "before 6am on monday" window
    # of renovate.json. Renovate still decides by that schedule what it may open.
    - cron: "17 0 * * 1"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Log what Renovate would do without creating branches or pull requests
        type: boolean
        default: false
      logLevel:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

# Renovate acts through RENOVATE_TOKEN, not through GITHUB_TOKEN, so the job itself needs no rights.
permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

env:
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: 44.257.9

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: renovatebot/github-action@v46.2.2
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || '' }}