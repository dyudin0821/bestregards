version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - noctx
    - sqlclosecheck
  settings:
    errorlint:
      # http.ErrAbortHandler comes out of recover() as a plain value, which is how net/http itself
      # compares it; wrapped errors do not apply there.
      comparison: false
  exclusions:
    generated: strict # sqlc output in internal/store/db
    presets:
      - std-error-handling
    rules:
      # Tests may drop errors of helpers that cannot fail in a meaningful way.
      - path: _test\.go
        linters: [errcheck, noctx]

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
