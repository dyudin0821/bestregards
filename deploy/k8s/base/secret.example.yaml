# NOT part of the kustomization: real values must never be committed. Create the Secret out of band
# (kubectl create secret, Sealed Secrets, External Secrets, SOPS...) under the name bestregards-secrets.
#
#   kubectl -n bestregards create secret generic bestregards-secrets --from-env-file=prod.secrets.env
#
# There is no DATABASE_URL here: it comes from the Secret bestregards-db-app that CloudNativePG creates.
#
# Every value must differ from the others (the service refuses to start otherwise) and must not hold a
# trailing newline or a space. Generate the random ones with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: bestregards-secrets
  namespace: bestregards
type: Opaque
stringData:
  BOT_TOKEN: "123456:CHANGE_ME"
  SESSION_SECRET: "CHANGE_ME_64_hex_chars"
  EVENTS_PEPPER: "CHANGE_ME_another_64_hex_chars"
  # The bot webhook: 32-256 characters from A-Z a-z 0-9 _ - ; leave out to run without the bot.
  WEBHOOK_SECRET: "CHANGE_ME_webhook_secret_32_chars_min"
  # Cloudflare Turnstile secret; set together with TURNSTILE_SITE_KEY in the ConfigMap.
  TURNSTILE_SECRET: "CHANGE_ME"
  # Bearer token for /metrics (at least 16 characters); the ServiceMonitor reads it from here too.
  METRICS_TOKEN: "CHANGE_ME_metrics_token"
  AI_API_KEY: "CHANGE_ME"
