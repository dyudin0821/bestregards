# Daily cleanup: old events (in chunks) and expired guests. It needs only the database, so it gets
# DATABASE_URL and nothing else from the Secret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bestregards-purge
  labels:
    app.kubernetes.io/name: bestregards
    app.kubernetes.io/component: purge
spec:
  schedule: "17 3 * * *"
  timeZone: Europe/Moscow
  concurrencyPolicy: Forbid # a slow run must not overlap the next one
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900 # the job itself gives up after 10 minutes
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bestregards
            app.kubernetes.io/component: purge
        spec:
          serviceAccountName: bestregards
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              image: ghcr.io/dyudin0821/bestregards
              imagePullPolicy: IfNotPresent
              args: ["purge"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: bestregards-db-app
                      key: uri
                - name: EVENTS_RETENTION_DAYS
                  valueFrom:
                    configMapKeyRef:
                      name: bestregards
                      key: EVENTS_RETENTION_DAYS
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
