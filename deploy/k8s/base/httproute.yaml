apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bestregards
  labels:
    app.kubernetes.io/name: bestregards
spec:
  parentRefs:
    - name: bestregards
      sectionName: https
  hostnames:
    - bestregards.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bestregards
          port: 80
      timeouts:
        request: 60s # an AI call lasts up to 25 s; the service itself cuts a request at 45 s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bestregards-redirect
  labels:
    app.kubernetes.io/name: bestregards
spec:
  parentRefs:
    - name: bestregards
      sectionName: http
  hostnames:
    - bestregards.example
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
